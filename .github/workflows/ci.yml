name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, property, guard and replay tests
        run: npm test
      - name: Checks (AI routing, storage, secrets, copy, attribution)
        run: npm run check
      - name: Production build and bundle scan
        run: npm run build

  deploy:
    # Deploys main to Firebase Hosting once the FIREBASE_SERVICE_ACCOUNT secret exists.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_SA == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SA == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_SA == 'true'
      - name: Build with the public web config
        if: env.HAS_SA == 'true'
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_SA == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
          target: ${{ vars.FIREBASE_HOSTING_SITE }}
      - name: Not configured
        if: env.HAS_SA != 'true'
        run: echo "Hosting deploy skipped until the FIREBASE_SERVICE_ACCOUNT secret is set."
